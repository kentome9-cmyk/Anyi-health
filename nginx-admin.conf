server {
    listen 80;
    server_name edc.yueyuean.cc;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name edc.yueyuean.cc;

    ssl_certificate /www/server/panel/vhost/cert/edc.yueyuean.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/edc.yueyuean.cc/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    client_max_body_size 500m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    access_log /www/wwwlogs/edc.yueyuean.cc-access.log;
    error_log /www/wwwlogs/edc.yueyuean.cc-error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /_next/static {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 60m;
        expires 60m;
        add_header Cache-Control "public, immutable";
    }

    location /uploads {
        alias /www/wwwroot/anyiai/public/uploads;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /public {
        alias /www/wwwroot/anyiai/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}